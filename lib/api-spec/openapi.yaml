openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: course
    description: Course content (weeks, lectures, topics)
  - name: assignments
    description: Homeworks, tests, midterm, final
  - name: practice
    description: Infinite practice sessions and adaptive problem generation
  - name: tutor
    description: AI tutor chat
  - name: detection
    description: AI-generation and diachronic detection
  - name: analytics
    description: User performance analytics and reports
  - name: practice-assignments
    description: Infinitely generatable practice twins of graded assignments
  - name: assessments
    description: Criterion-valid diagnostic assessments (baseline + per-week parallel forms, plus free self-assessment)
  - name: lecture-personalize
    description: Student-authored alternate versions of a lecture section
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /course/overview:
    get:
      operationId: getCourseOverview
      tags: [course]
      summary: Course-level overview with weeks, assignments, and progress
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseOverview"

  /course/weeks/{weekNumber}:
    get:
      operationId: getWeek
      tags: [course]
      summary: Get one week's lectures and assignment list
      parameters:
        - name: weekNumber
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 4 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Week"

  /course/lectures/{lectureId}:
    get:
      operationId: getLecture
      tags: [course]
      summary: Get the full lecture text for a topic
      parameters:
        - name: lectureId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lecture"

  /course/topics:
    get:
      operationId: listTopics
      tags: [course]
      summary: List all course topics (used for analytics + tutor scoping)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Topic"

  /assignments:
    get:
      operationId: listAssignments
      tags: [assignments]
      summary: List all assignments (homeworks, tests, midterm, final)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssignmentSummary"

  /assignments/{assignmentId}:
    get:
      operationId: getAssignment
      tags: [assignments]
      summary: Get an assignment with its problems
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"

  /assignments/{assignmentId}/start:
    post:
      operationId: startAssignmentAttempt
      tags: [assignments]
      summary: Start (or resume) an attempt on an assignment
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptState"

  /assignments/attempts/{attemptId}:
    get:
      operationId: getAttempt
      tags: [assignments]
      summary: Get current attempt state (answers, time remaining)
      parameters:
        - name: attemptId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptState"

  /assignments/attempts/{attemptId}/answer:
    put:
      operationId: saveAnswer
      tags: [assignments]
      summary: Save (or update) a single answer with keystroke trace
      parameters:
        - name: attemptId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerSaved"

  /assignments/attempts/{attemptId}/submit:
    post:
      operationId: submitAttempt
      tags: [assignments]
      summary: Submit the attempt for grading (also runs AI + diachronic detection)
      parameters:
        - name: attemptId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttemptResult"

  /practice/sessions:
    post:
      operationId: startPracticeSession
      tags: [practice]
      summary: Start a new practice session (infinite, adaptive)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PracticeSessionInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeSession"

  /practice/sessions/{sessionId}/next:
    post:
      operationId: nextPracticeProblem
      tags: [practice]
      summary: Generate the next problem (adaptive difficulty, de-novo)
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NextProblemInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeProblem"

  /practice/sessions/{sessionId}/grade:
    post:
      operationId: gradePracticeAnswer
      tags: [practice]
      summary: Grade a practice answer; returns correct/incorrect and explanation
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PracticeAnswerInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeGrade"

  /tutor/ask:
    post:
      operationId: askTutor
      tags: [tutor]
      summary: Ask the AI tutor a question (text reply with optional spoken audio URL)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TutorAskInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutorReply"

  /detection/scan:
    post:
      operationId: scanText
      tags: [detection]
      summary: Run AI-generation + diachronic detection on a candidate answer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetectionScanInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectionResult"

  /analytics/summary:
    get:
      operationId: getAnalyticsSummary
      tags: [analytics]
      summary: Overall performance summary (averages, attempts, streaks)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"

  /analytics/topics:
    get:
      operationId: getTopicAnalytics
      tags: [analytics]
      summary: Per-topic accuracy and strength/weakness ranking
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopicAnalytics"

  /analytics/activity:
    get:
      operationId: getRecentActivity
      tags: [analytics]
      summary: Recent practice + assignment activity timeline
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /analytics/report:
    post:
      operationId: generateReport
      tags: [analytics]
      summary: Generate a narrative strengths/weaknesses report
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsReport"

  /practice-assignments/generate:
    post:
      operationId: generatePracticeAssignment
      tags: [practice-assignments]
      summary: Generate a fresh practice twin of a graded assignment (infinite, never-repeating, never overlapping the real problems)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratePracticeInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeAssignmentPlayable"

  /practice-assignments/{id}:
    get:
      operationId: getPracticeAssignment
      tags: [practice-assignments]
      summary: Get a practice assignment with its problems
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeAssignmentPlayable"

  /practice-assignments/{id}/answer:
    put:
      operationId: savePracticeAssignmentAnswer
      tags: [practice-assignments]
      summary: Save (or update) a single practice answer with keystroke trace
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerSaved"

  /practice-assignments/{id}/submit:
    post:
      operationId: submitPracticeAssignment
      tags: [practice-assignments]
      summary: Submit a practice attempt for heavy feedback + analytics-based focus pointers
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeAssignmentResult"

  /practice-assignments/{id}/result:
    get:
      operationId: getPracticeAssignmentResult
      tags: [practice-assignments]
      summary: Get the graded result (feedback + focus report) of a submitted practice attempt
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeAssignmentResult"

  /practice-assignments/{id}/feedback-chat:
    post:
      operationId: practiceFeedbackChat
      tags: [practice-assignments]
      summary: Dialogue with the app about the feedback on a practice attempt (optionally scoped to one problem)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackChatInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackChatReply"

  /practice-assignments/{id}/messages:
    get:
      operationId: getPracticeFeedbackMessages
      tags: [practice-assignments]
      summary: Get the feedback-dialogue history for a practice attempt
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedbackMessage"

  /practice-assignments/history/{sourceAssignmentId}:
    get:
      operationId: getPracticeAssignmentHistory
      tags: [practice-assignments]
      summary: List past practice attempts for a graded assignment (drives readiness + encouragement)
      parameters:
        - name: sourceAssignmentId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeReadiness"

  /assessments:
    get:
      operationId: getAssessmentsOverview
      tags: [assessments]
      summary: Overview of the 5 graded diagnostic slots (lock + status) plus the free self-assessment summary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentsOverview"

  /assessments/{slot}/start:
    post:
      operationId: startAssessment
      tags: [assessments]
      summary: Start (or resume) a graded diagnostic slot, generating a fresh non-overlapping parallel form
      parameters:
        - name: slot
          in: path
          required: true
          schema:
            type: string
            enum: [baseline, week1, week2, week3, week4]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentInstance"

  /assessments/self/start:
    post:
      operationId: startSelfAssessment
      tags: [assessments]
      summary: Start a fresh, ungraded self-assessment (unlimited, full-subject parallel form)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentInstance"

  /assessments/instances/{id}:
    get:
      operationId: getAssessmentInstance
      tags: [assessments]
      summary: Get an assessment instance with its problems
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentInstance"

  /assessments/instances/{id}/answer:
    put:
      operationId: saveAssessmentAnswer
      tags: [assessments]
      summary: Save (or update) a single assessment answer with keystroke trace
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerSaved"

  /assessments/instances/{id}/submit:
    post:
      operationId: submitAssessment
      tags: [assessments]
      summary: Submit an assessment for scoring, per-domain feedback, and growth vs baseline
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentResult"

  /assessments/instances/{id}/result:
    get:
      operationId: getAssessmentResult
      tags: [assessments]
      summary: Get the graded result (per-domain feedback + growth) of a submitted assessment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentResult"

  /course/lectures/{lectureId}/custom:
    get:
      operationId: listLectureCustomVersions
      tags: [lecture-personalize]
      summary: List student-authored alternate versions of a lecture
      parameters:
        - name: lectureId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LectureCustomVersion"
    post:
      operationId: createLectureCustomVersion
      tags: [lecture-personalize]
      summary: Generate a personalized alternate version of a lecture section from custom instructions
      parameters:
        - name: lectureId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLectureCustomInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LectureCustomVersion"

  /course/lectures/custom/{versionId}:
    delete:
      operationId: deleteLectureCustomVersion
      tags: [lecture-personalize]
      summary: Delete a student-authored lecture version
      parameters:
        - name: versionId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerSaved"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    Topic:
      type: object
      required: [id, slug, title, weekNumber]
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        weekNumber: { type: integer }
        blurb: { type: ["string", "null"] }

    Lecture:
      type: object
      required: [id, topicId, title, weekNumber, body]
      properties:
        id: { type: integer }
        topicId: { type: integer }
        title: { type: string }
        weekNumber: { type: integer }
        body:
          type: string
          description: Short Markdown lecture text (the baseline / minimum-detail version). The frontend lets users select passages and send them to the tutor.
        bodyMedium:
          type: ["string", "null"]
          description: Medium-length version with more explanation and more examples. Null if not yet generated.
        bodyLong:
          type: ["string", "null"]
          description: Long version with the most explanation and the most examples. Null if not yet generated.

    Week:
      type: object
      required: [weekNumber, title, lectures, assignments]
      properties:
        weekNumber: { type: integer }
        title: { type: string }
        summary: { type: ["string", "null"] }
        lectures:
          type: array
          items:
            $ref: "#/components/schemas/LectureRef"
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/AssignmentSummary"

    LectureRef:
      type: object
      required: [id, title, topicId]
      properties:
        id: { type: integer }
        title: { type: string }
        topicId: { type: integer }

    AssignmentSummary:
      type: object
      required: [id, kind, title, weekNumber, problemCount, isTimed, status]
      properties:
        id: { type: integer }
        kind:
          type: string
          enum: [homework, test, midterm, final]
        title: { type: string }
        weekNumber: { type: integer }
        problemCount: { type: integer }
        isTimed: { type: boolean }
        timeLimitMinutes: { type: ["integer", "null"] }
        status:
          type: string
          enum: [not_started, in_progress, submitted]
        bestScore: { type: ["number", "null"] }
        lastAttemptId: { type: ["integer", "null"] }

    Assignment:
      type: object
      required: [id, kind, title, weekNumber, isTimed, problems]
      properties:
        id: { type: integer }
        kind:
          type: string
          enum: [homework, test, midterm, final]
        title: { type: string }
        weekNumber: { type: integer }
        isTimed: { type: boolean }
        timeLimitMinutes: { type: ["integer", "null"] }
        instructions: { type: ["string", "null"] }
        problems:
          type: array
          items:
            $ref: "#/components/schemas/Problem"

    Problem:
      type: object
      required: [id, position, prompt, topicId]
      properties:
        id: { type: integer }
        position: { type: integer }
        prompt: { type: string }
        topicId: { type: integer }
        topicTitle: { type: ["string", "null"] }
        hint: { type: ["string", "null"] }

    AttemptState:
      type: object
      required: [id, assignmentId, status, startedAt, answers]
      properties:
        id: { type: integer }
        assignmentId: { type: integer }
        status:
          type: string
          enum: [in_progress, submitted]
        startedAt: { type: string, format: date-time }
        submittedAt: { type: ["string", "null"], format: date-time }
        deadlineAt: { type: ["string", "null"], format: date-time }
        answers:
          type: array
          items:
            $ref: "#/components/schemas/SavedAnswer"

    SavedAnswer:
      type: object
      required: [problemId, answer]
      properties:
        problemId: { type: integer }
        answer: { type: string }
        keystrokeCount: { type: ["integer", "null"] }
        eraseCount: { type: ["integer", "null"] }

    AnswerInput:
      type: object
      required: [problemId, answer, trace]
      properties:
        problemId: { type: integer }
        answer: { type: string }
        trace:
          $ref: "#/components/schemas/KeystrokeTrace"

    KeystrokeTrace:
      type: object
      required: [keystrokeCount, eraseCount, durationMs]
      properties:
        keystrokeCount: { type: integer }
        eraseCount: { type: integer }
        bulkInsertCount: { type: integer, default: 0 }
        longestBulkInsertChars: { type: integer, default: 0 }
        rewriteSegments: { type: integer, default: 0 }
        durationMs: { type: integer }

    AnswerSaved:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    AttemptResult:
      type: object
      required: [attemptId, score, total, percent, perProblem, detection]
      properties:
        attemptId: { type: integer }
        score: { type: number }
        total: { type: number }
        percent: { type: number }
        perProblem:
          type: array
          items:
            $ref: "#/components/schemas/ProblemResult"
        detection:
          type: array
          items:
            $ref: "#/components/schemas/DetectionResult"

    ProblemResult:
      type: object
      required: [problemId, correct, explanation]
      properties:
        problemId: { type: integer }
        correct: { type: boolean }
        userAnswer: { type: string }
        correctAnswer: { type: string }
        explanation: { type: string }

    PracticeSessionInput:
      type: object
      required: [tutorEnabled]
      properties:
        weekNumber: { type: ["integer", "null"] }
        topicId: { type: ["integer", "null"] }
        tutorEnabled: { type: boolean }
        focusOnWeaknesses: { type: boolean, default: true }
        initialDifficulty:
          type: ["number", "null"]
          description: Starting difficulty 1-5; if omitted defaults to 2.0

    PracticeSession:
      type: object
      required: [id, tutorEnabled, difficulty, weekNumber]
      properties:
        id: { type: integer }
        tutorEnabled: { type: boolean }
        difficulty: { type: number }
        weekNumber: { type: ["integer", "null"] }
        topicId: { type: ["integer", "null"] }
        focusOnWeaknesses: { type: boolean }

    NextProblemInput:
      type: object
      properties:
        request:
          type: ["string", "null"]
          description: Free-form user request, e.g. "give me harder probability problems"
        topicId: { type: ["integer", "null"] }

    PracticeProblem:
      type: object
      required: [id, prompt, topicId, difficulty]
      properties:
        id: { type: integer }
        prompt: { type: string }
        topicId: { type: integer }
        topicTitle: { type: string }
        difficulty: { type: number }

    PracticeAnswerInput:
      type: object
      required: [problemId, answer, trace]
      properties:
        problemId: { type: integer }
        answer: { type: string }
        trace:
          $ref: "#/components/schemas/KeystrokeTrace"

    PracticeGrade:
      type: object
      required: [problemId, correct, explanation, newDifficulty]
      properties:
        problemId: { type: integer }
        correct: { type: boolean }
        correctAnswer: { type: string }
        explanation: { type: string }
        newDifficulty: { type: number }
        tutorTip: { type: ["string", "null"] }

    TutorAskInput:
      type: object
      required: [message]
      properties:
        sessionId: { type: ["integer", "null"] }
        message: { type: string }
        selectedLectureText: { type: ["string", "null"] }
        lectureId: { type: ["integer", "null"] }
        problemId: { type: ["integer", "null"] }

    TutorReply:
      type: object
      required: [text]
      properties:
        text: { type: string }
        audioUrl: { type: ["string", "null"] }

    DetectionScanInput:
      type: object
      required: [text, trace]
      properties:
        text: { type: string }
        trace:
          $ref: "#/components/schemas/KeystrokeTrace"

    DetectionResult:
      type: object
      required: [problemId, aiScore, aiFlagged, diachronicScore, diachronicFlagged, rationale]
      properties:
        problemId: { type: ["integer", "null"] }
        aiScore:
          type: number
          description: 0..1 probability the text is AI-generated
        aiFlagged: { type: boolean }
        diachronicScore:
          type: number
          description: 0..1 probability the user is rewording AI output (based on keystroke pattern)
        diachronicFlagged: { type: boolean }
        rationale: { type: string }

    AnalyticsSummary:
      type: object
      required: [officialAverage, practiceAccuracy, attemptsCount, practiceCount, streakDays, finalGrade, diagnosticsCompleted, diagnosticsTotal, diagnosticsBucketPercent]
      properties:
        officialAverage: { type: number }
        practiceAccuracy: { type: number }
        attemptsCount: { type: integer }
        practiceCount: { type: integer }
        streakDays: { type: integer }
        strongestTopic: { type: ["string", "null"] }
        weakestTopic: { type: ["string", "null"] }
        finalGrade:
          type: number
          description: Weighted course grade = 0.8 * officialAverage + 0.2 * diagnosticsBucketPercent
        diagnosticsCompleted:
          type: integer
          description: Number of the 5 graded diagnostic slots that have been submitted
        diagnosticsTotal:
          type: integer
          description: Total graded diagnostic slots (always 5)
        diagnosticsBucketPercent:
          type: number
          description: Completion-based diagnostics grade bucket = diagnosticsCompleted / diagnosticsTotal * 100

    TopicAnalytics:
      type: object
      required: [topicId, topicTitle, weekNumber, attempts, accuracy, strengthLabel]
      properties:
        topicId: { type: integer }
        topicTitle: { type: string }
        weekNumber: { type: integer }
        attempts: { type: integer }
        accuracy: { type: number }
        strengthLabel:
          type: string
          enum: [strong, solid, developing, weak, untested]

    ActivityItem:
      type: object
      required: [id, kind, title, at]
      properties:
        id: { type: integer }
        kind:
          type: string
          enum: [practice, assignment]
        title: { type: string }
        at: { type: string, format: date-time }
        score: { type: ["number", "null"] }
        topicTitle: { type: ["string", "null"] }

    AnalyticsReport:
      type: object
      required: [generatedAt, narrative, strengths, weaknesses, recommendations]
      properties:
        generatedAt: { type: string, format: date-time }
        narrative: { type: string }
        strengths:
          type: array
          items: { type: string }
        weaknesses:
          type: array
          items: { type: string }
        recommendations:
          type: array
          items: { type: string }

    GeneratePracticeInput:
      type: object
      required: [sourceAssignmentId]
      properties:
        sourceAssignmentId: { type: integer }

    PracticeAssignmentPlayable:
      type: object
      required: [id, sourceAssignmentId, kind, title, weekNumber, status, problems]
      properties:
        id: { type: integer }
        sourceAssignmentId: { type: integer }
        kind:
          type: string
          enum: [homework, test, midterm, final]
        title: { type: string }
        weekNumber: { type: integer }
        status:
          type: string
          enum: [in_progress, submitted]
        problems:
          type: array
          items:
            $ref: "#/components/schemas/Problem"

    PracticeAssignmentResult:
      type: object
      required: [id, score, total, percent, perProblem, focusReport]
      properties:
        id: { type: integer }
        score: { type: number }
        total: { type: number }
        percent: { type: number }
        perProblem:
          type: array
          items:
            $ref: "#/components/schemas/PracticeProblemResult"
        focusReport:
          $ref: "#/components/schemas/FocusReport"

    PracticeProblemResult:
      type: object
      required: [problemId, position, prompt, correct, userAnswer, correctAnswer, explanation, feedback]
      properties:
        problemId: { type: integer }
        position: { type: integer }
        prompt: { type: string }
        topicTitle: { type: ["string", "null"] }
        correct: { type: boolean }
        userAnswer: { type: string }
        correctAnswer: { type: string }
        explanation: { type: string }
        feedback: { type: string }

    FocusReport:
      type: object
      required: [summary, readiness, pointers, encouragement]
      properties:
        summary: { type: string }
        readiness:
          type: number
          description: 0..100 estimate of readiness for the graded version
        pointers:
          type: array
          items:
            $ref: "#/components/schemas/FocusPointer"
        encouragement: { type: string }

    FocusPointer:
      type: object
      required: [topicTitle, issue, action]
      properties:
        topicTitle: { type: string }
        issue: { type: string }
        action: { type: string }
        masteryPercent: { type: ["number", "null"] }

    FeedbackChatInput:
      type: object
      required: [message]
      properties:
        message: { type: string }
        problemId: { type: ["integer", "null"] }

    FeedbackChatReply:
      type: object
      required: [reply]
      properties:
        reply: { type: string }

    FeedbackMessage:
      type: object
      required: [id, role, content, at]
      properties:
        id: { type: integer }
        problemId: { type: ["integer", "null"] }
        role:
          type: string
          enum: [user, assistant]
        content: { type: string }
        at: { type: string, format: date-time }

    PracticeReadiness:
      type: object
      required: [attempts, bestPercent, lastPercent, readiness, items]
      properties:
        attempts: { type: integer }
        bestPercent: { type: ["number", "null"] }
        lastPercent: { type: ["number", "null"] }
        readiness:
          type: number
          description: 0..100 readiness estimate for the graded version
        items:
          type: array
          items:
            $ref: "#/components/schemas/PracticeHistoryItem"

    PracticeHistoryItem:
      type: object
      required: [id, percent, submittedAt]
      properties:
        id: { type: integer }
        percent: { type: ["number", "null"] }
        submittedAt: { type: ["string", "null"], format: date-time }

    CourseOverview:
      type: object
      required: [title, weeks, totals]
      properties:
        title: { type: string }
        weeks:
          type: array
          items:
            $ref: "#/components/schemas/Week"
        totals:
          type: object
          required: [assignmentsCompleted, assignmentsTotal, practiceCount]
          properties:
            assignmentsCompleted: { type: integer }
            assignmentsTotal: { type: integer }
            practiceCount: { type: integer }

    AssessmentsOverview:
      type: object
      required: [slots, completed, total, bucketPercent, self]
      properties:
        slots:
          type: array
          items:
            $ref: "#/components/schemas/AssessmentSlot"
        completed:
          type: integer
          description: Number of the graded slots that have been submitted
        total:
          type: integer
          description: Total graded slots (always 5)
        bucketPercent:
          type: number
          description: completed / total * 100 (the diagnostics grade bucket)
        self:
          $ref: "#/components/schemas/AssessmentSelfSummary"

    AssessmentSlot:
      type: object
      required: [slot, title, locked, status]
      properties:
        slot:
          type: string
          enum: [baseline, week1, week2, week3, week4]
        title: { type: string }
        locked: { type: boolean }
        unlockHint: { type: ["string", "null"] }
        status:
          type: string
          enum: [not_started, in_progress, submitted]
        instanceId: { type: ["integer", "null"] }
        scorePercent: { type: ["number", "null"] }
        passed: { type: ["boolean", "null"] }

    AssessmentSelfSummary:
      type: object
      required: [attempts]
      properties:
        attempts: { type: integer }
        lastScorePercent: { type: ["number", "null"] }
        lastInstanceId: { type: ["integer", "null"] }

    AssessmentInstance:
      type: object
      required: [id, slot, kind, title, status, problems]
      properties:
        id: { type: integer }
        slot:
          type: string
          enum: [baseline, week1, week2, week3, week4, self]
        kind:
          type: string
          enum: [graded, self]
        title: { type: string }
        status:
          type: string
          enum: [in_progress, submitted]
        problems:
          type: array
          items:
            $ref: "#/components/schemas/AssessmentProblem"

    AssessmentProblem:
      type: object
      required: [id, position, domain, domainTitle, prompt]
      properties:
        id: { type: integer }
        position: { type: integer }
        domain: { type: string }
        domainTitle: { type: string }
        prompt: { type: string }
        hint: { type: ["string", "null"] }
        answer: { type: string, default: "" }

    AssessmentResult:
      type: object
      required: [id, slot, kind, score, total, percent, passed, perProblem, feedback]
      properties:
        id: { type: integer }
        slot:
          type: string
          enum: [baseline, week1, week2, week3, week4, self]
        kind:
          type: string
          enum: [graded, self]
        score: { type: number }
        total: { type: number }
        percent: { type: number }
        passed: { type: boolean }
        perProblem:
          type: array
          items:
            $ref: "#/components/schemas/AssessmentProblemResult"
        feedback:
          $ref: "#/components/schemas/AssessmentFeedback"

    AssessmentProblemResult:
      type: object
      required: [problemId, position, domain, domainTitle, prompt, correct, userAnswer, correctAnswer, explanation]
      properties:
        problemId: { type: integer }
        position: { type: integer }
        domain: { type: string }
        domainTitle: { type: string }
        prompt: { type: string }
        correct: { type: boolean }
        userAnswer: { type: string }
        correctAnswer: { type: string }
        explanation: { type: string }
        feedback: { type: ["string", "null"] }

    AssessmentFeedback:
      type: object
      required: [overall, perDomain]
      properties:
        overall: { type: string }
        perDomain:
          type: array
          items:
            $ref: "#/components/schemas/AssessmentDomainFeedback"
        growth: { type: ["string", "null"] }

    AssessmentDomainFeedback:
      type: object
      required: [domain, domainTitle, correct, total, comment]
      properties:
        domain: { type: string }
        domainTitle: { type: string }
        correct: { type: integer }
        total: { type: integer }
        comment: { type: string }

    CreateLectureCustomInput:
      type: object
      required: [instructions]
      properties:
        instructions: { type: string }
        sourceText: { type: ["string", "null"] }
        label: { type: ["string", "null"] }

    LectureCustomVersion:
      type: object
      required: [id, lectureId, label, instructions, body, createdAt]
      properties:
        id: { type: integer }
        lectureId: { type: integer }
        label: { type: string }
        instructions: { type: string }
        sourceText: { type: ["string", "null"] }
        body: { type: string }
        createdAt: { type: string, format: date-time }
